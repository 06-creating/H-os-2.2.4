plugins {
    id 'com.android.application' version '8.10.0'
    }

android {
    namespace 'com.harrisonos.legacy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.harrisonos.legacy'
        minSdk 8
        targetSdk 8
        versionCode 2
        versionName 'R1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
